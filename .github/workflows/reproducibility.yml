name: Reproducibility

on:

  pull_request:

    branches:
      - main

  workflow_dispatch:

jobs:

  reproduce:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

        with:
          use-public-rspm: true

      - name: Restore renv
        uses: r-lib/actions/setup-renv@v2

      - name: Run complete analytical pipeline
        run: |
          Rscript run_all.R

      - name: Verify methodological RDS
        run: |
          test -f output/bloque1/diagnosticos/OBJETOS_ICVLF_v6_3_BLOQUE1.rds

      - name: Verify processed index
        run: |
          test -f data/processed/icvlf_monthly.csv

      - name: Verify dictionary
        run: |
          test -f data/dictionary.csv